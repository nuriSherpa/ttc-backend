# Tuned for ~4 GB of RAM given to Docker Desktop (Settings > Resources).
# If you give Docker less than 4 GB, halve shared_buffers / effective_cache_size.
listen_addresses = '*'
max_connections = 100

timezone = 'America/Toronto'
log_timezone = 'America/Toronto'

shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 32MB                    # loader raises this per-session for the rebuild
maintenance_work_mem = 512MB

# Big bulk loads (4.3M stop_times, ~16M departures): fewer checkpoints
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = on

# SSD / Docker volume
random_page_cost = 1.1
effective_io_concurrency = 200

# Realtime tables churn every 30 s
autovacuum_naptime = 30s

log_min_duration_statement = 1000
log_autovacuum_min_duration = 1000

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
